# Render.com Deployment Configuration
# https://render.com/docs/yaml-spec

services:
  # Backend API (Go)
  - type: web
    name: bienestarapp-backend
    env: go
    region: oregon
    rootDir: backend
    buildCommand: go build -o app .
    startCommand: ./app
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure random value
    healthCheckPath: /health

# The backend requires POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# POSTGRES_HOST, and POSTGRES_SSLMODE to be configured on the existing Render
# PostgreSQL service. This blueprint does not provision a database.

# Frontend can be deployed separately to:
# - Render Static Site
# - Vercel (recommended for React)
# - Netlify
# See FRONTEND_DEPLOYMENT.md for details
